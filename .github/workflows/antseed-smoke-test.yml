name: AntSeed buyer smoke test

on:
  push:
    paths:
      - ".github/workflows/antseed-smoke-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  buyer-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install AntSeed CLI and test GLM 5.3 Flash with free-only caps
        shell: bash
        run: |
          set -Eeuo pipefail

          npm install --global @antseed/cli
          antseed --version

          # Mirror the safeguards configured by the Render wrapper.
          antseed config init
          antseed config buyer set routingPreferences.preferFreePeers true
          antseed config buyer set maxPricing.defaults.inputUsdPerMillion 0
          antseed config buyer set maxPricing.defaults.outputUsdPerMillion 0
          antseed config buyer show

          antseed buyer start > "$RUNNER_TEMP/antseed-buyer.log" 2>&1 &
          BUYER_PID=$!
          trap 'status=$?; trap - EXIT; kill "$BUYER_PID" 2>/dev/null || true; wait "$BUYER_PID" 2>/dev/null || true; if [ "$status" -ne 0 ]; then echo "AntSeed buyer log:"; cat "$RUNNER_TEMP/antseed-buyer.log"; fi; exit "$status"' EXIT

          echo "Waiting for the local buyer API..."
          ready=0
          for i in $(seq 1 90); do
            if ! kill -0 "$BUYER_PID" 2>/dev/null; then
              echo "AntSeed buyer exited before becoming ready."
              cat "$RUNNER_TEMP/antseed-buyer.log"
              exit 1
            fi
            if curl --silent --show-error --fail http://127.0.0.1:8377/v1/models -o "$RUNNER_TEMP/models.json"; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "Buyer API did not become ready."
            exit 1
          fi

          echo "Buyer API is ready. Matching model IDs:"
          node -e 'const j=require(process.argv[1]); for (const m of (j.data || [])) if (/glm.*5.*3.*flash|glm-5-3-flash/i.test(m.id)) console.log(m.id);' "$RUNNER_TEMP/models.json"

          echo "Sending the glm-5-3-flash chat-completion request with hard $0 pricing caps..."
          if ! curl --silent --show-error --fail-with-body --max-time 120 \
            http://127.0.0.1:8377/v1/chat/completions \
            -H 'Content-Type: application/json' \
            -d '{
              "model": "glm-5-3-flash",
              "messages": [
                {"role": "user", "content": "Hello!"}
              ]
            }' -o "$RUNNER_TEMP/chat-response.json"; then
            cat "$RUNNER_TEMP/chat-response.json" 2>/dev/null || true
            exit 1
          fi

          cat "$RUNNER_TEMP/chat-response.json"
          node -e '
            const fs = require("node:fs");
            const r = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (r.error || !Array.isArray(r.choices) || !r.choices[0]?.message) {
              console.error("Unexpected or error response:", JSON.stringify(r));
              process.exit(1);
            }
            const cost = Number(r.usage?.cost);
            if (!Number.isFinite(cost)) {
              console.error("FAIL: response did not include a numeric usage.cost, so zero-cost routing cannot be verified.");
              process.exit(1);
            }
            console.log("\nReported request cost: $" + cost);
            if (cost > 0) {
              console.error("FAIL: response reports a positive cost despite hard zero-price caps.");
              process.exit(1);
            }
            console.log("PASS: assistant response received and reported cost is zero.");
          ' "$RUNNER_TEMP/chat-response.json"

          echo "AntSeed buyer log:"
          cat "$RUNNER_TEMP/antseed-buyer.log"
