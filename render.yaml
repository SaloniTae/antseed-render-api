services:
  - type: web
    name: antseed-render-api
    repo: https://github.com/SaloniTae/antseed-render-api
    branch: main
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: API_TOKEN
        generateValue: true
